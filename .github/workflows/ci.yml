name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Show versions
        run: moon version
      - name: Check formatting
        run: moon fmt --check
      - name: Check
        run: moon check
      - name: Build
        run: moon build
      - name: Test
        run: moon test
